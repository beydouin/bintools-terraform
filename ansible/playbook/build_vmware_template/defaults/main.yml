---
# Safe default: inspect the Terraform change without creating anything.
terraform_action: plan

# Terraform project containing the VMware golden-template definition.
terraform_project_dir: "{{ build_vmware_template_root }}/vsphere-template"

# The first golden-template target. Future templates can override these values.
template_name: template-01.universe.hm
template_ip: 192.168.3.11
attach_install_iso: false
