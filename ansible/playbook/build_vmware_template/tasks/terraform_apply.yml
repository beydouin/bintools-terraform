---
- name: Apply approved Terraform plan for VMware template
  ansible.builtin.command:
    argv:
      - terraform
      - apply
      - -input=false
      - -auto-approve
      - build_vmware_template.tfplan
  args:
    chdir: "{{ terraform_project_dir }}"
  environment:
    TF_VAR_vsphere_server: "{{ vmware_hostname }}"
    TF_VAR_vsphere_user: "{{ vmware_username }}"
    TF_VAR_vsphere_password: "{{ vmware_password }}"
  no_log: true
